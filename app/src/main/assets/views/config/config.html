<div class="page config-page">
    <header class="page-header config-header">
        <button class="btn back-button" id="backToPos">← CASSA</button>
        <h1>CONFIGURAZIONE</h1>
        <div class="header-save-slot">SALVA</div>
    </header>

    <nav class="config-tabs">
        <button class="btn config-tab active" data-panel="articlesPanel">ARTICOLI E PREZZI</button>
        <button class="btn config-tab" data-panel="departmentsPanel">REPARTI</button>
        <button class="btn config-tab" data-panel="cashesPanel">CASSE</button>
        <button class="btn config-tab" data-panel="passwordPanel">PASSWORD</button>
        <button class="btn" id="runAudit">DIAGNOSTICA</button>
    </nav>

    <section id="articlesPanel" class="config-panel active">
        <div class="article-browser">
            <div class="article-browser-head">
                <input id="configArticleSearch" type="search" placeholder="Cerca articolo...">
                <button class="btn" id="newArticle">NUOVO</button>
            </div>
            <div id="configArticleList" class="config-article-list"></div>
        </div>

        <form id="articleForm" class="article-form">
            <input type="hidden" id="articleId">
            <input type="hidden" id="articleRev">

            <label>NOME<input id="articleName" required></label>
            <div class="form-row">
                <label>TIPO<select id="articleType"><option value="S">S - Servizio</option><option value="P">P - Prodotto</option></select></label>
                <label>PREZZO<input id="articlePrice" type="number" step="0.01" min="0"></label>
            </div>
            <div class="form-row">
                <label>REPARTO<select id="articleDepartment"></select></label>
                <label>POSIZIONE
                    <select id="articlePosition">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                        <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
                        <option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
                        <option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option>
                    </select>
                </label>
            </div>
            <div class="form-row">
                <label>BARCODE<input id="articleBarcode" inputmode="numeric"></label>
                <label>IVA %<input id="articleVat" type="number" step="1" min="0" max="100" value="22"></label>
            </div>
            <div class="form-row">
                <label>CATEGORIA<input id="articleCategory"></label>
                <label>MARCA<input id="articleBrand"></label>
            </div>
            <label class="check-line"><input id="articleActive" type="checkbox" checked> ARTICOLO ATTIVO</label>
            <button class="btn save-button config-save-fixed" type="submit">SALVA</button>
        </form>
    </section>

    <section id="departmentsPanel" class="config-panel">
        <div class="department-editor">
            <div class="department-head"><span>REPARTO</span><span>NOME</span><span>VISTA</span></div>
            <div id="departmentRows"></div>
            <button class="btn save-button config-save-fixed" id="saveDepartments">SALVA</button>
        </div>
    </section>

    <section id="cashesPanel" class="config-panel">
        <div class="cash-editor">
            <div class="form-row">
                <label>CASSA DI QUESTO DISPOSITIVO<select id="currentCash"></select></label>
                <label>LARGHEZZA CARTA
                    <select id="paperWidthMm">
                        <option value="80">80 mm</option>
                        <option value="58">58 mm</option>
                    </select>
                </label>
            </div>
            <div id="cashRows"></div>
            <div class="cash-actions">
                <button class="btn" id="addCash">AGGIUNGI CASSA</button>
            </div>
            <button class="btn save-button config-save-fixed" id="saveCashes">SALVA</button>
        </div>
    </section>

    <section id="passwordPanel" class="config-panel">
        <div class="password-editor">
            <div class="password-columns">
                <div class="password-zone">
                    <div class="password-zone-title">DATI INTESTAZIONE</div>
                    <label>RIGA 1<input id="accountHeader1"></label>
                    <label>RIGA 2<input id="accountHeader2"></label>
                    <label>RIGA 3<input id="accountHeader3"></label>
                    <label>RIGA 4<input id="accountHeader4"></label>
                    <label style="display:none">RIGA 5<input id="accountHeader5"></label>
                    <div id="headerPermission" class="password-demo-note"></div>
                </div>

                <div class="password-zone">
                    <div class="password-zone-title">DATI UTENTE</div>
                    <label>CODICE FISCALE<input id="accountCf"></label>
                    <label>PARTITA IVA<input id="accountPiva"></label>
                    <label>PIN<input id="accountPin"></label>
                    <label>PASSWORD ATTUALE<input id="accountPwd" type="password" autocomplete="current-password"></label>
                    <div id="userPermission" class="password-demo-note"></div>
                </div>
            </div>

            <div class="password-change-zone">
                <div class="password-zone-title">CAMBIO PASSWORD</div>
                <div class="password-change-row">
                    <label>NUOVA PASSWORD<input id="accountPassword1" type="password" autocomplete="new-password"></label>
                    <label>RIPETI PASSWORD<input id="accountPassword2" type="password" autocomplete="new-password"></label>
                    <button class="btn" id="changePassword" type="button">CAMBIO PASSWORD</button>
                </div>
                <div id="passwordPermission" class="password-demo-note"></div>
            </div>

            <button class="btn save-button config-save-fixed" id="saveAccountConfig" type="button">SALVA</button>
        </div>
    </section>
</div>

<div class="pos-app">
    <div class="left">
        <div class="reparti" id="reparti"></div>

        <div class="article-area">
            <div class="articoli-bottoni" id="articoliBottoni"></div>

            <div class="articoli-lista-panel" id="articoliListaPanel">
                <input id="articleSearch" class="article-search" type="search" placeholder="Cerca articolo..." autocomplete="off">
                <div id="articoliLista" class="articoli-lista"></div>
            </div>
        </div>
    </div>

    <div class="right">
        <div class="lista" id="carrello"></div>

        <div class="summary compact-summary">
            <div class="box articoli compact-box">
                <span class="label">ARTICOLI</span>
                <span class="value" id="articleCount">0</span>
            </div>
            <div class="box totale compact-box">
                <span class="label">TOTALE</span>
                <span class="value" id="totalValue">0,00 €</span>
            </div>
        </div>

        <div class="keypad-zone" id="keypad">
            <div class="display-line">
                <button class="selected-display quantity-display active" id="quantityBox" type="button">
                    <span class="display-label">QTA</span>
                    <span class="selected-quantity" id="quantityDisplay">1</span>
                </button>

                <button class="btn key multiply-key" data-key="X" type="button">X</button>

                <button class="selected-display amount-display" id="amountBox" type="button">
                    <span class="display-label">IMPORTO</span>
                    <span class="selected-price" id="selectedPrice">0,00 €</span>
                </button>
            </div>

            <div class="keypad-main">
                <div class="numeric-keypad">
                    <button class="btn key" type="button">7</button>
                    <button class="btn key" type="button">8</button>
                    <button class="btn key" type="button">9</button>
                    <button class="btn key" type="button">4</button>
                    <button class="btn key" type="button">5</button>
                    <button class="btn key" type="button">6</button>
                    <button class="btn key" type="button">1</button>
                    <button class="btn key" type="button">2</button>
                    <button class="btn key" type="button">3</button>
                    <button class="btn key utility-key" data-key="%" type="button">%</button>
                    <button class="btn key" type="button">0</button>
                    <button class="btn key utility-key" type="button">,</button>
                </div>

                <div class="action-stack">
                    <button class="btn key ok icon-button" data-key="OK" type="button" title="Conferma" aria-label="Conferma">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4 4L19 6.5"/></svg>
                    </button>
                    <button class="btn selected-delete icon-button" id="deleteItem" type="button" title="Elimina riga" aria-label="Elimina riga">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 10v7M14 10v7"/></svg>
                    </button>
                    <button class="btn selected-discount icon-button" id="discountItem" type="button" title="Sconto" aria-label="Sconto">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9l7 7-8 8-8-8V5zM8 9h.01"/><text x="11" y="16">%</text></svg>
                    </button>
                    <button class="btn action annulla icon-button cancel-button" id="cancelSale" type="button" title="Annulla" aria-label="Annulla">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7L4 12l5 5M5 12h8a6 6 0 0 1 6 6"/></svg>
                        <span class="action-counter" id="cancelCount"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="brand-box">AltraCassa</div>
        <button class="btn action tool" id="openConfig" title="Configurazione">⚙</button>
        <button class="btn action tool" id="openSummary" title="Riepilogo">☷</button>
        <button class="btn action contanti" id="cashPayment">CONTANTI</button>
        <button class="btn action pos" id="cardPayment">POS</button>
    </div>
</div>

<div class="progress-popup" id="progressPopup">
    <div class="progress-box">
        <div class="progress-title">OPERAZIONE IN CORSO</div>
        <div class="progress-message" id="progressMessage">Preparazione operazione...</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-percent" id="progressPercent">0%</div>
    </div>
</div>

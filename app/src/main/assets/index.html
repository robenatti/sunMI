<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>POS UI</title>

    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>

<div class="app">

    <!-- LEFT -->
    <div class="left">

        <div class="reparti">
            <button class="btn reparto" data-reparto="1">R1</button>
            <button class="btn reparto" data-reparto="2">R2</button>
            <button class="btn reparto" data-reparto="3">R3</button>
            <button class="btn reparto" data-reparto="4">R4</button>
            <button class="btn reparto" data-reparto="5">R5</button>
            <button class="btn reparto" data-reparto="6">R6</button>
            <button class="btn reparto" data-reparto="7">R7</button>
            <button class="btn reparto" data-reparto="8">R8</button>
        </div>

        <div class="servizi">
            <button class="btn servizio" data-pos="1"></button>
            <button class="btn servizio" data-pos="2"></button>
            <button class="btn servizio" data-pos="3"></button>
            <button class="btn servizio" data-pos="4"></button>

            <button class="btn servizio" data-pos="5"></button>
            <button class="btn servizio" data-pos="6"></button>
            <button class="btn servizio" data-pos="7"></button>
            <button class="btn servizio" data-pos="8"></button>

            <button class="btn servizio" data-pos="9"></button>
            <button class="btn servizio" data-pos="10"></button>
            <button class="btn servizio" data-pos="11"></button>
            <button class="btn servizio" data-pos="12"></button>

            <button class="btn servizio" data-pos="13"></button>
            <button class="btn servizio" data-pos="14"></button>
            <button class="btn servizio" data-pos="15"></button>
            <button class="btn servizio" data-pos="16"></button>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right">

        <!-- LISTA -->
        <div class="lista"></div>

        <!-- SUMMARY -->
        <div class="summary">
            <div class="box articoli">
                <span class="label">ARTICOLI</span>
                <span class="value">0</span>
            </div>

            <div class="box totale">
                <span class="label">TOTALE</span>
                <span class="value">0,00 €</span>
            </div>
        </div>

        <!-- SELECTED -->
        <div class="selected-bar">
            <div class="selected-display">
                <div class="selected-price" id="selectedPrice">0,00 €</div>
            </div>

            <button class="btn selected-delete">ELIMINA</button>
            <button class="btn selected-discount">SCONTO</button>
        </div>

        <!-- KEYPAD -->
        <div class="keypad">
            <button class="btn key">7</button>
            <button class="btn key">8</button>
            <button class="btn key">9</button>
            <button class="btn key">←</button>

            <button class="btn key">4</button>
            <button class="btn key">5</button>
            <button class="btn key">6</button>
            <button class="btn key">CL</button>

            <button class="btn key">1</button>
            <button class="btn key">2</button>
            <button class="btn key">3</button>
            <button class="btn key">X</button>

            <button class="btn key">%</button>
            <button class="btn key">0</button>
            <button class="btn key">,</button>
            <button class="btn key ok">OK</button>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        <button class="btn action annulla">ANNULLA</button>
        <button class="btn action altro">ALTRO</button>
        <button class="btn action contanti">CONTANTI</button>
        <button class="btn action pos">POS</button>
    </div>

</div>

<!-- JS -->
<script src="js/config.js"></script>
<script src="js/interfaceKotlin.js"></script>
<script src="js/receiptConvert.js"></script>
<script src="js/posFlow.js"></script>
<script src="js/uiAction.js"></script>

<!-- POPUP PAGAMENTO -->
<div class="popup" id="popup">
    <div class="popup-box">

        <div class="popup-title">CONFERMA PAGAMENTO</div>

        <div class="popup-body">
            <div class="popup-row">
                <span>Importo</span>
                <span id="popupImporto">0,00 €</span>
            </div>

            <div class="popup-row">
                <span>Modalità</span>
                <span id="popupTipo">POS</span>
            </div>
        </div>

        <div class="popup-actions">
            <button class="btn popup-cancel">ANNULLA</button>
            <button class="btn popup-ok">CONFERMA</button>
        </div>

    </div>
</div>

<!-- POPUP AVANZAMENTO -->
<div class="progress-popup" id="progressPopup">
    <div class="progress-box">

        <div class="progress-title">OPERAZIONE IN CORSO</div>

        <div class="progress-message" id="progressMessage">
            Preparazione operazione...
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="progress-percent" id="progressPercent">
            0%
        </div>

    </div>
</div>

</body>

</html>

<!-- fine file index.html -->
